[workspace]
members = ["crates/nako-metadata-scraper"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
description = "Official Nako Addon Sidecars for metadata scraping and provider integrations."
license = "AGPL-3.0-or-later"
repository = "https://github.com/Latias94/nako-official-addons"
homepage = "https://github.com/Latias94/nako"
readme = "README.md"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
nako-addon-protocol = "0.1.0-alpha.1"
