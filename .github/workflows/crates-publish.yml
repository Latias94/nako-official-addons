name: crates-publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish official addon crates to crates.io after dry-run succeeds"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_VERSION: "1.95"
  OFFICIAL_ADDON_CRATES: "nako-notification-bridge nako-metadata-scraper nako-chromecast-renderer"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dry-run:
    name: crates.io dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official addons
        uses: actions/checkout@v6
        with:
          path: nako-official-addons

      - name: Checkout Nako mainline
        uses: actions/checkout@v6
        with:
          repository: Latias94/nako
          path: nako
          token: ${{ secrets.NAKO_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nako-official-addons -> target

      - name: Check publish readiness
        working-directory: nako-official-addons
        run: |
          set -euo pipefail
          for crate in $OFFICIAL_ADDON_CRATES; do
            cargo publish -p "$crate" --locked --dry-run
          done

  publish:
    name: crates.io publish
    runs-on: ubuntu-latest
    needs: dry-run
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    environment: crates-io
    steps:
      - name: Checkout official addons
        uses: actions/checkout@v6
        with:
          path: nako-official-addons

      - name: Checkout Nako mainline
        uses: actions/checkout@v6
        with:
          repository: Latias94/nako
          path: nako
          token: ${{ secrets.NAKO_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nako-official-addons -> target

      - name: Publish crates
        working-directory: nako-official-addons
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in $OFFICIAL_ADDON_CRATES; do
            cargo publish -p "$crate" --locked
          done
