name: release-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.95"
  ADDON_IMAGE: nako-metadata-scraper:ci

jobs:
  rust:
    name: rust release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official addons
        uses: actions/checkout@v4
        with:
          path: nako-official-addons

      - name: Checkout Nako core
        uses: actions/checkout@v4
        with:
          repository: Latias94/nako
          path: nako

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nako-official-addons -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check Cargo metadata
        working-directory: nako-official-addons
        run: cargo metadata --format-version 1 --no-deps

      - name: Check formatting
        working-directory: nako-official-addons
        run: cargo fmt --all -- --check

      - name: Run package tests
        working-directory: nako-official-addons
        run: cargo nextest run -p nako-metadata-scraper --no-fail-fast

      - name: Run workspace tests
        working-directory: nako-official-addons
        run: cargo nextest run --workspace --no-fail-fast

      - name: Check diff hygiene
        working-directory: nako-official-addons
        run: git diff --check

  container:
    name: container release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official addons
        uses: actions/checkout@v4
        with:
          path: nako-official-addons

      - name: Checkout Nako core
        uses: actions/checkout@v4
        with:
          repository: Latias94/nako
          path: nako

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metadata scraper image
        working-directory: nako-official-addons
        run: |
          docker buildx build \
            --build-context nako-core=../nako \
            -f addons/metadata-scraper/Dockerfile \
            -t "$ADDON_IMAGE" \
            --load .

      - name: Smoke test metadata scraper image
        working-directory: nako-official-addons
        run: |
          set -euo pipefail

          container_id="$(docker run -d --rm -p 127.0.0.1:19101:9100 "$ADDON_IMAGE")"
          trap 'docker stop "$container_id" >/dev/null' EXIT

          if python - <<'PY'
          import json
          import sys
          import time
          import urllib.request

          deadline = time.time() + 20
          last_error = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:19101/manifest.json", timeout=2) as response:
                      manifest = json.load(response)

                  assert manifest["id"] == "nako.official.metadata-scraper"
                  assert manifest["version"] == "0.1.0-alpha.1"
                  assert manifest["protocol_version"] == "0.1.0-alpha.1"

                  print(json.dumps({
                      "id": manifest["id"],
                      "version": manifest["version"],
                      "protocol_version": manifest["protocol_version"],
                  }, separators=(",", ":")))
                  sys.exit(0)
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.5)

          print(f"manifest smoke failed: {last_error}", file=sys.stderr)
          sys.exit(1)
          PY
          then
            exit 0
          fi

          echo "metadata scraper container did not serve the expected manifest" >&2
          docker logs "$container_id" >&2 || true
          exit 1
