services:
  nako-notification-bridge:
    build:
      context: ../..
      dockerfile: addons/notification-bridge/Dockerfile
      additional_contexts:
        nako: ../../../nako
    image: ghcr.io/latias94/nako-notification-bridge:0.1.0-alpha.2
    restart: unless-stopped
    environment:
      NAKO_NOTIFICATION_BRIDGE_LISTEN_ADDR: "0.0.0.0:9110"
      NAKO_NOTIFICATION_BRIDGE_BASE_URL: "http://nako-notification-bridge:9110"
      NAKO_NOTIFICATION_BRIDGE_HTTP_WEBHOOK_ENABLED: "false"
      NAKO_NOTIFICATION_BRIDGE_DISCORD_WEBHOOK_ENABLED: "false"
      NAKO_NOTIFICATION_BRIDGE_PROVIDER_ATTEMPT_HISTORY_CAPACITY: "20"
      # Inject these through operator secret/config tooling. They are not
      # stored in Nako core.
      # NAKO_NOTIFICATION_BRIDGE_HTTP_WEBHOOK_URL: "${NAKO_NOTIFICATION_BRIDGE_HTTP_WEBHOOK_URL}"
      # NAKO_NOTIFICATION_BRIDGE_HTTP_WEBHOOK_SHARED_SECRET: "${NAKO_NOTIFICATION_BRIDGE_HTTP_WEBHOOK_SHARED_SECRET}"
      # NAKO_NOTIFICATION_BRIDGE_DISCORD_WEBHOOK_URL: "${NAKO_NOTIFICATION_BRIDGE_DISCORD_WEBHOOK_URL}"
      # NAKO_NOTIFICATION_BRIDGE_TEMPLATE_SUMMARY: "Nako {{event_kind}} event for {{subject_kind}} {{subject_id}}"
    ports:
      - "9110:9110"
