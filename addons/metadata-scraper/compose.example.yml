services:
  nako-metadata-scraper:
    build:
      context: ../..
      dockerfile: addons/metadata-scraper/Dockerfile
    image: ghcr.io/latias94/nako-metadata-scraper:0.1.0-alpha.1
    restart: unless-stopped
    environment:
      NAKO_METADATA_SCRAPER_LISTEN_ADDR: "0.0.0.0:9100"
      NAKO_METADATA_SCRAPER_BASE_URL: "http://nako-metadata-scraper:9100"
      NAKO_METADATA_SCRAPER_LANGUAGE: "en-US"
      NAKO_METADATA_SCRAPER_PROVIDER_FIXTURE_ENABLED: "true"
      NAKO_METADATA_SCRAPER_PROVIDER_TMDB_ENABLED: "false"
      NAKO_METADATA_SCRAPER_PROVIDER_BANGUMI_ENABLED: "false"
      NAKO_METADATA_SCRAPER_BANGUMI_USER_AGENT: "Latias94/nako-official-addons/nako-metadata-scraper/0.1.0-alpha.1 (https://github.com/Latias94/nako-official-addons)"
      # Set only when enabling TMDB. Keep real tokens in your secret manager.
      # NAKO_METADATA_SCRAPER_TMDB_READ_ACCESS_TOKEN: "${TMDB_READ_ACCESS_TOKEN}"
      # Optional when enabling Bangumi authenticated visibility.
      # NAKO_METADATA_SCRAPER_BANGUMI_ACCESS_TOKEN: "${BANGUMI_ACCESS_TOKEN}"
    ports:
      - "9100:9100"
